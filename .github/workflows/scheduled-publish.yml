# Rebuilds the site every day just after midnight Korean time, so that guides and news items
# dated in the future (see TODAY in _src/build.py) go live on their publication date.
name: Scheduled publish

on:
  schedule:
    - cron: "5 15 * * *"  # 15:05 UTC = 00:05 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: python3 _src/build.py
      - name: Commit and push if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Scheduled publish $(date +%F)"
            git push
          else
            echo "Nothing new to publish today."
          fi
